name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev # OIDC trust is scoped to this environment; add required reviewers here if wanted
    permissions:
      contents: read
      id-token: write # GitHub OIDC → AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            infra/package-lock.json
      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix infra
      - run: npm run build --prefix frontend

      - name: Apply config from GitHub variables
        working-directory: infra
        env:
          MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          QUERY_REWRITE_MODEL_ID: ${{ vars.QUERY_REWRITE_MODEL_ID }}
          # Public repo → step env is visible in Actions logs. Sensitive values come from *secrets* (masked as ***).
          BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
          OKTA_CONFIG: ${{ secrets.OKTA_CONFIG }}
          ALLOWED_IP_CIDRS: ${{ secrets.ALLOWED_IP_CIDRS }}
          ALLOWED_EMAIL_DOMAINS: ${{ secrets.ALLOWED_EMAIL_DOMAINS }}
        run: |
          set -euo pipefail
          for v in MODEL_ID BUDGET_EMAIL COGNITO_DOMAIN_PREFIX; do
            if [ -z "${!v}" ]; then echo "::error::GitHub variable/secret for $v is not set (see docs/cicd.md)"; exit 1; fi
          done
          jq --arg region "$AWS_REGION" --arg model "$MODEL_ID" --arg email "$BUDGET_EMAIL" --arg prefix "$COGNITO_DOMAIN_PREFIX" \
            '.context.region=$region | .context.modelId=$model | .context.budget.email=$email | .context.cognitoDomainPrefix=$prefix' \
            cdk.json > cdk.tmp.json && mv cdk.tmp.json cdk.json
          if [ -n "$QUERY_REWRITE_MODEL_ID" ]; then
            jq --arg m "$QUERY_REWRITE_MODEL_ID" '.context.queryRewriteModelId=$m' cdk.json > cdk.tmp.json && mv cdk.tmp.json cdk.json
          fi
          if [ -n "$OKTA_CONFIG" ]; then
            echo "$OKTA_CONFIG" | jq -e 'has("issuerUrl") and has("clientId") and has("clientSecretName")' > /dev/null \
              || { echo "::error::OKTA_CONFIG must be JSON with issuerUrl, clientId, clientSecretName"; exit 1; }
            jq --argjson okta "$OKTA_CONFIG" '.context.okta=$okta' cdk.json > cdk.tmp.json && mv cdk.tmp.json cdk.json
          fi
          if [ -n "$ALLOWED_IP_CIDRS" ]; then
            # Accept a JSON array or a comma/space/newline-separated list.
            if echo "$ALLOWED_IP_CIDRS" | jq -e 'type == "array"' > /dev/null 2>&1; then
              ips="$ALLOWED_IP_CIDRS"
            else
              ips=$(printf '%s' "$ALLOWED_IP_CIDRS" | tr ', ' '\n\n' | sed '/^$/d' | jq -R . | jq -sc .)
            fi
            jq --argjson ips "$ips" '.context.allowedIpCidrs=$ips' cdk.json > cdk.tmp.json && mv cdk.tmp.json cdk.json
            echo "IP allowlist: $(echo "$ips" | jq 'length') entries"
          fi
          if [ -n "$ALLOWED_EMAIL_DOMAINS" ]; then
            # Comma/space-separated, e.g. "example.co.jp" → self sign-up for those domains (ADR-014).
            doms=$(printf '%s' "$ALLOWED_EMAIL_DOMAINS" | tr ', ' '\n\n' | sed '/^$/d' | jq -R . | jq -sc .)
            jq --argjson d "$doms" '.context.allowedEmailDomains=$d' cdk.json > cdk.tmp.json && mv cdk.tmp.json cdk.json
            echo "Self sign-up domains: $(echo "$doms" | jq 'length')"
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # contains the account id → secret
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: cdk deploy
        working-directory: infra
        run: |
          npx cdk deploy --all \
            --require-approval never \
            --outputs-file cdk-outputs.json \
            -c strictConfig=true

      - name: Smoke test
        working-directory: infra
        run: |
          set -euo pipefail
          URL=$(jq -r '."Pmbok-Frontend".CloudFrontUrl' cdk-outputs.json)
          echo "Site: $URL"
          # With the IP allowlist active, this GitHub runner is (correctly) outside the company network.
          blocked=$(curl -s -o /dev/null -D - "$URL/" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-pmbok-blocked"{print $2}')
          if [ "$blocked" = "ip" ]; then
            api_blocked=$(curl -s -o /dev/null -D - "$URL/api/me" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-pmbok-blocked"{print $2}')
            [ "$api_blocked" = "ip" ] || { echo "::error::site is IP-restricted but /api is not"; exit 1; }
            echo "IP allowlist active: site and /api return 403 to this runner. Run the full smoke test from the office/VPN (docs/deploy.md §7)."
            echo "### Deployed :rocket: (IP-restricted)" >> "$GITHUB_STEP_SUMMARY"
            echo "Site: $URL — reachable only from the company network" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
          [ "$code" = "200" ] || { echo "::error::site returned $code"; exit 1; }
          curl -sf "$URL/config.json" | jq -e '.userPoolId and .clientId' > /dev/null
          # Unauthenticated API call must reach the Lambda (via OAC) and be rejected by it with 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/me")
          [ "$code" = "401" ] || { echo "::error::/api/me without token returned $code (expected 401 — check OAC / Lambda permissions)"; exit 1; }
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: $URL" >> "$GITHUB_STEP_SUMMARY"
